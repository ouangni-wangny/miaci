name: Deploy

# CD : push sur main -> CI (tests) -> déploiement via le workflow réutilisable
# de xsel-deploy-mutualise. Ce fichier est la seule configuration de
# déploiement du projet ; tout le reste vit dans le kit (ADR-0004).
# Guide complet : docs/CI-CD.md

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    uses: ouangni-wangny/xsel-deploy-mutualise/.github/workflows/deploy.yml@v1.0.1
    with:
      stack: laravel
      # TODO: remplacer par le vrai chemin cPanel de l'app (cPanel -> Domains,
      # colonne "Document Root", sans le /public final).
      deploy_path: /home/CPANEL_USER/miaci.ci
      # TODO: URL publique réelle. /up est le healthcheck natif de Laravel
      # (bootstrap/app.php).
      health_check_url: https://miaci.ci/up
      php_version: '8.3'
      node_version: '22'
      # TODO: à vérifier sur le serveur (`ls -d /opt/alt/php*/usr/bin/php`).
      # Le dump SQL du projet indique PHP 8.4 en production ; sur CloudLinux,
      # /usr/bin/php ne correspond pas à la version choisie pour le compte
      # (voir README de xsel-deploy-mutualise). Sur un hébergeur sans
      # CloudLinux, supprimer ces deux lignes (défauts : php / composer).
      php_bin: /opt/alt/php84/usr/bin/php
      composer_bin: /opt/alt/php84/usr/bin/composer
    secrets:
      SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
