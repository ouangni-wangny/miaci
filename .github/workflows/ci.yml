name: CI

# Tests + qualité + build des assets.
#
# - push sur main : chaque intégration est vérifiée.
# - pull_request : chaque PR est testée avant fusion.
# - workflow_dispatch : lancement manuel depuis l'onglet Actions.
# Le déploiement se fait à la main (README, section « Déploiement »).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests, style, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # gd/zip : maatwebsite/excel + dompdf ; pdo_sqlite : base des tests
          # (phpunit.xml -> sqlite :memory:, aucune base MySQL requise en CI).
          extensions: mbstring, dom, fileinfo, gd, zip, intl, bcmath, pdo_sqlite, sqlite3
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Créer le .env de test
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      # Non bloquant pour l'instant : le code existant n'est pas encore
      # formaté selon Pint (~26 fichiers, style uniquement). Une fois
      # `vendor/bin/pint` exécuté et commité, retirer `continue-on-error`
      # pour rendre ce contrôle bloquant.
      - name: Pint (style)
        continue-on-error: true
        run: ./vendor/bin/pint --test

      # Les vues de test chargent @vite : le manifeste (public/build) doit exister
      # avant les tests, sinon « Vite manifest not found ».
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Vérifie aussi que les assets Vite compilent avant la fusion.
      - name: Build des assets (Vite)
        run: |
          npm ci
          npm run build

      - name: Tests
        run: php artisan test
